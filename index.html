<!DOCTYPE html>
<html>
<head>
  <title>Blackberry's Hunt</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #a8d08d;
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      overflow: hidden;
    }
    #gameArea {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    .object, .berry {
      position: absolute;
      touch-action: manipulation;
    }
    .object {
      width: 90px;
      height: 90px;
      cursor: pointer;
    }
    .berry {
      width: 40px;
      display: none;
    }
    #clue {
      display: none;
      font-size: 1.5em;
      background: rgba(255,255,255,0.8);
      padding: 10px;
      border-radius: 8px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    #counter {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255,255,255,0.7);
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <div id="gameArea">
    <div id="counter">Berries left: <span id="count"></span></div>
    <div id="clue">🍇 Clue: "The treasure is hidden where the blackberry vines meet the old oak."</div>
  </div>
  <script>
    const gameArea = document.getElementById('gameArea');
    const berryCount = 15;
    let collected = 0;
    const countDisplay = document.getElementById('count');
    countDisplay.textContent = berryCount;

    // Reliable images from Wikimedia Commons
    const treeImage = "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Tree_icon_01.png/96px-Tree_icon_01.png";
    const bushImage = "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Bush_icon.png/96px-Bush_icon.png";
    const berryImage = "https://upload.wikimedia.org/wikipedia/commons/thumb/1/15/Strawberry_icon.svg/48px-Strawberry_icon.svg.png";

    // Create 30 trees + 30 bushes
    let objects = [];
    for (let i = 0; i < 30; i++) objects.push(treeImage);
    for (let i = 0; i < 30; i++) objects.push(bushImage);

    // Shuffle objects randomly
    objects = objects.sort(() => Math.random() - 0.5);

    // Randomly choose 15 objects to hide berries
    let berryPositions = new Set();
    while (berryPositions.size < berryCount) {
      berryPositions.add(Math.floor(Math.random() * objects.length));
    }

    // Place objects on screen
    objects.forEach((src, index) => {
      const obj = document.createElement('img');
      obj.src = src;
      obj.className = 'object';
      obj.style.top = Math.random() * (window.innerHeight - 100) + 'px';
      obj.style.left = Math.random() * (window.innerWidth - 100) + 'px';

      if (berryPositions.has(index)) {
        const berry = document.createElement('img');
        berry.src = berryImage;
        berry.className = 'berry';
        berry.style.top = obj.style.top;
        berry.style.left = obj.style.left;

        obj.addEventListener('click', () => revealBerry(berry, obj));
        obj.addEventListener('touchstart', () => revealBerry(berry, obj));

        gameArea.appendChild(berry);
      }

      gameArea.appendChild(obj);
    });

    function revealBerry(berry, obj) {
      berry.style.display = 'block';
      obj.remove();
      berry.addEventListener('click', () => collectBerry(berry));
      berry.addEventListener('touchstart', () => collectBerry(berry));
    }

    function collectBerry(berry) {
      berry.remove();
      collected++;
      countDisplay.textContent = berryCount - collected;
      if (collected === berryCount) {
        document.getElementById('clue').style.display = 'block';
      }
    }
  </script>
</body>
</html>
