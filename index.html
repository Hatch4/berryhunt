<!DOCTYPE html>
<html>
<head>
  <title>Blackberry's Hunt</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: url('https://upload.wikimedia.org/wikipedia/commons/4/4d/Grass_texture.jpg') repeat;
      background-size: 200px 200px;
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      overflow: hidden;
    }
    #gameArea {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    .object, .berry {
      position: absolute;
      touch-action: manipulation;
      z-index: 1;
    }
    .object {
      width: 90px;
      height: 90px;
      cursor: pointer;
    }
    .berry {
      width: 40px;
      display: none;
    }
    #clue {
      display: none;
      font-size: 1.5em;
      background: rgba(255,255,255,0.9);
      padding: 10px;
      border-radius: 8px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 999;
      opacity: 0;
      animation: fadeIn 1.5s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    #counter {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255,255,255,0.7);
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 1.2em;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div id="gameArea">
    <div id="counter">Berries left: <span id="count"></span></div>
    <div id="clue">🍇 Clue: "The treasure is hidden where the blackberry vines meet the old oak."</div>
  </div>
  <script>
    const gameArea = document.getElementById('gameArea');
    const berryCount = 15;
    let collected = 0;
    const countDisplay = document.getElementById('count');
    countDisplay.textContent = berryCount;

    // Images hosted in your repo
    const treeImage = "images/tree.png";
    const bushImage = "images/bush.png";
    const berryImage = "images/berry.png";

    // Sound effects
    const popSound = new Audio("sounds/pop.mp3");
    const tadaSound = new Audio("sounds/tada.mp3");
    const rustlingSound = new Audio("sounds/rustling.mp3");

    // Create 30 trees + 30 bushes
    let objects = [];
    for (let i = 0; i < 30; i++) objects.push(treeImage);
    for (let i = 0; i < 30; i++) objects.push(bushImage);

    // Shuffle objects randomly
    objects = objects.sort(() => Math.random() - 0.5);

    // Randomly choose 15 objects to hide berries
    let berryPositions = new Set();
    while (berryPositions.size < berryCount) {
      berryPositions.add(Math.floor(Math.random() * objects.length));
    }

    // Place objects on screen
    objects.forEach((src, index) => {
      const obj = document.createElement('img');
      obj.src = src;
      obj.className = 'object';
      obj.style.top = Math.random() * (window.innerHeight - 100) + 'px';
      obj.style.left = Math.random() * (window.innerWidth - 100) + 'px';

      // If this object hides a berry
      if (berryPositions.has(index)) {
        const berry = document.createElement('img');
        berry.src = berryImage;
        berry.className = 'berry';
        berry.style.top = obj.style.top;
        berry.style.left = obj.style.left;

        obj.addEventListener('click', () => {
          rustlingSound.currentTime = 0;
          rustlingSound.play();
          obj.remove();
          berry.style.display = 'block';
          gameArea.appendChild(berry);
          berry.addEventListener('click', () => collectBerry(berry));
        });

        obj.addEventListener('touchstart', () => {
          rustlingSound.currentTime = 0;
          rustlingSound.play();
          obj.remove();
          berry.style.display = 'block';
          gameArea.appendChild(berry);
          berry.addEventListener('touchstart', () => collectBerry(berry));
        });
      } else {
        // If no berry, still play rustling sound
        obj.addEventListener('click', () => {
          rustlingSound.currentTime = 0;
          rustlingSound.play();
          obj.remove();
        });
        obj.addEventListener('touchstart', () => {
          rustlingSound.currentTime = 0;
          rustlingSound.play();
          obj.remove();
        });
      }

      gameArea.appendChild(obj);
    });

    function collectBerry(berry) {
      berry.remove();
      collected++;
      popSound.currentTime = 0;
      popSound.play();
      countDisplay.textContent = berryCount - collected;
      if (collected === berryCount) {
        const clue = document.getElementById('clue');
        clue.style.display = 'block';
        clue.style.animation = 'fadeIn 1.5s ease forwards';
        tadaSound.currentTime = 0;
        tadaSound.play();
      }
    }
  </script>
</body>
</html>
