<!DOCTYPE html>
<html>
<head>
  <title>Blackberry's Hunt – Adventure Edition</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }
    #gameArea {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-color: #000;
    }
    #bgOverlay {
      position:absolute;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background-size:cover;
      background-position:center;
      filter:brightness(0.7) blur(2px);
      z-index:0;
    }
    #uiBar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 5px 10px;
      box-sizing: border-box;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.4);
      color: #fff;
      z-index: 1000;
      font-size: 0.9em;
    }
    #messageBox {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.9);
      padding: 10px 15px;
      border-radius: 8px;
      max-width: 80vw;
      font-size: 0.9em;
      z-index: 1000;
    }
    .object, .berry, .creature, #player {
      position: absolute;
      touch-action: manipulation;
      z-index: 1;
      user-select: none;
    }
    .object {
      width: 80px;
      height: 80px;
      cursor: pointer;
    }
    .berry {
      width: 40px;
      cursor: pointer;
    }
    .creature {
      width: 60px;
      height: 60px;
    }
    #player {
      width: 70px;
      height: 70px;
      z-index: 10;
      transition: left 0.3s linear, top 0.3s linear, transform 0.15s linear;
    }
    .particle {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 5;
    }
    #mapOverlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255,255,255,0.95);
      padding: 15px;
      border-radius: 10px;
      z-index: 2000;
      display: none;
      max-width: 80vw;
      text-align: left;
    }
    #mapOverlay h2 {
      margin-top: 0;
    }
    #mapOverlay button {
      margin-top: 10px;
      padding: 6px 12px;
      font-size: 0.9em;
    }
    #searchButton {
      position:absolute;
      bottom:20px;
      left:50%;
      transform:translateX(-50%);
      padding:10px 20px;
      font-size:1.2em;
      display:none;
      z-index:2000;
    }
  </style>
</head>
<body>
  <div id="gameArea">
    <div id="bgOverlay"></div>

    <div id="uiBar">
      <div>Level: <span id="levelName"></span></div>
      <div>Berries left: <span id="berryCount"></span></div>
    </div>

    <div id="messageBox"></div>

    <div id="mapOverlay">
      <h2>Blackberry's Map</h2>
      <p>The berries form a trail leading to the Oak Grove. The treasure lies beneath the old oak where the vines meet its roots.</p>
      <button id="goToOakButton">Travel to Oak Grove</button>
    </div>

    <button id="searchButton">Search</button>
  </div>

  <script>
    const gameArea = document.getElementById('gameArea');
    const bgOverlay = document.getElementById('bgOverlay');
    const levelNameEl = document.getElementById('levelName');
    const berryCountEl = document.getElementById('berryCount');
    const messageBox = document.getElementById('messageBox');
    const mapOverlay = document.getElementById('mapOverlay');
    const goToOakButton = document.getElementById('goToOakButton');
    const searchButton = document.getElementById('searchButton');

    // --- Level data ---
    const levelData = [
      {
        name: "Meadow",
        background: "https://upload.wikimedia.org/wikipedia/commons/4/4d/Grass_texture.jpg",
        objects: ["images/tree.png", "images/bush.png"],
        creatures: ["images/rabbit.png"],
        berries: 5
      },
      {
        name: "Forest Edge",
        background: "https://upload.wikimedia.org/wikipedia/commons/6/6f/Forest_path.jpg",
        objects: ["images/tree.png", "images/bush.png", "images/log.png"],
        creatures: ["images/squirrel.png"],
        berries: 5
      },
      {
        name: "Deep Woods",
        background: "https://upload.wikimedia.org/wikipedia/commons/3/3f/Dark_forest.jpg",
        objects: ["images/tree.png", "images/bush.png", "images/rock.png"],
        creatures: ["images/owl.png"],
        berries: 5
      },
      {
        name: "Oak Grove",
        background: "https://upload.wikimedia.org/wikipedia/commons/5/5c/Oak_tree.jpg",
        objects: ["images/oak.png", "images/bush.png"],
        creatures: ["images/bird.png"],
        berries: 0
      }
    ];

    const berryImage = "images/berry.png";

    // Sounds (replace with your own local files)
    const ambientSounds = [
      new Audio("sounds/ambient_meadow.mp3"),
      new Audio("sounds/ambient_forest.mp3"),
      new Audio("sounds/ambient_deepwoods.mp3"),
      new Audio("sounds/ambient_oakgrove.mp3")
    ];
    const rustlingSound = new Audio("sounds/rustling.mp3");
    const popSound = new Audio("sounds/pop.mp3");
    const creatureSound = new Audio("sounds/creature.mp3");
    const treasureSound = new Audio("sounds/tada.mp3");

    ambientSounds.forEach(a => { a.loop = true; a.volume = 0.4; });

    let currentLevelIndex = 0;
    let berriesLeft = 0;
    let collectedTotal = 0;
    let player;
    let objects = [];
    let creatures = [];
    let randomEventTimer = null;

    let currentSearchTarget = null;
    let currentSearchTapsRequired = 1;
    let currentSearchTaps = 0;

    // --- Player setup ---
    function createPlayer() {
      player = document.createElement('img');
      player.id = "player";
      player.src = "images/blackberry.png"; // your avatar
      player.style.left = "50%";
      player.style.top = "50%";
      player.style.transform = "translate(-50%, -50%)";
      gameArea.appendChild(player);

      gameArea.addEventListener('click', (e) => {
        if (
          e.target.classList.contains('object') ||
          e.target.classList.contains('berry') ||
          e.target.classList.contains('creature') ||
          e.target.id === 'searchButton' ||
          e.target.id === 'goToOakButton'
        ) {
          return;
        }
        const rect = gameArea.getBoundingClientRect();
        movePlayerTo(e.clientX - rect.left, e.clientY - rect.top);
        hideSearchButton();
      });
    }

    function movePlayerTo(px, py) {
      player.style.left = px + "px";
      player.style.top = py + "px";
      player.style.transform = "translate(-50%, -50%)";
    }

    function waitForArrival(targetX, targetY, callback) {
      const check = setInterval(() => {
        const px = parseInt(player.style.left);
        const py = parseInt(player.style.top);
        const dist = Math.hypot(px - targetX, py - targetY);
        if (dist < 60) {
          clearInterval(check);
          callback();
        }
      }, 100);
    }

    // --- Messaging ---
    function showMessage(text, duration = 3000) {
      messageBox.textContent = text;
      if (duration > 0) {
        setTimeout(() => {
          if (messageBox.textContent === text) {
            messageBox.textContent = "";
          }
        }, duration);
      }
    }

    // --- Level setup ---
    function startLevel(index) {
      currentLevelIndex = index;
      const level = levelData[index];

      bgOverlay.style.backgroundImage = `url('${level.background}')`;

      objects.forEach(o => o.remove());
      creatures.forEach(c => c.remove());
      objects = [];
      creatures = [];
      mapOverlay.style.display = "none";
      hideSearchButton();

      ambientSounds.forEach(a => { a.pause(); a.currentTime = 0; });
      ambientSounds[index].play().catch(() => {});

      levelNameEl.textContent = level.name;

      berriesLeft = level.berries;
      berryCountEl.textContent = berriesLeft;

      const totalObjects = 25;
      const berryPositions = new Set();
      while (berryPositions.size < level.berries) {
        berryPositions.add(Math.floor(Math.random() * totalObjects));
      }

      for (let i = 0; i < totalObjects; i++) {
        const src = level.objects[Math.floor(Math.random() * level.objects.length)];
        const obj = document.createElement('img');
        obj.src = src;
        obj.className = 'object';

        const x = Math.random() * (window.innerWidth - 100);
        const y = Math.random() * (window.innerHeight - 160) + 60;
        obj.style.left = x + "px";
        obj.style.top = y + "px";

        if (berryPositions.has(i)) {
          const tapsRequired = Math.random() < 0.4 ? 3 : 1;

          obj.addEventListener('click', () => {
            const objX = parseInt(obj.style.left);
            const objY = parseInt(obj.style.top);
            movePlayerTo(objX, objY);
            waitForArrival(objX, objY, () => {
              showSearchButton(obj, tapsRequired);
            });
          });
        } else {
          obj.addEventListener('click', () => {
            const objX = parseInt(obj.style.left);
            const objY = parseInt(obj.style.top);
            movePlayerTo(objX, objY);
            waitForArrival(objX, objY, () => {
              rustlingSound.currentTime = 0;
              rustlingSound.play();
              createParticles(objX + 40, objY + 40, "#00ff00");
              obj.remove();
              hideSearchButton();
            });
          });
        }

        gameArea.appendChild(obj);
        objects.push(obj);
      }

      spawnCreatures(level);

      if (randomEventTimer) clearInterval(randomEventTimer);
      randomEventTimer = setInterval(triggerRandomEvent, 8000);

      if (index === 0) {
        showMessage("Blackberry: \"Let's start in the meadow. I smell berries nearby!\"", 4000);
      } else if (index === 1) {
        showMessage("Blackberry: \"The forest edge is thicker... the berries must be hiding well.\"", 4000);
      } else if (index === 2) {
        showMessage("Blackberry: \"It's dark here. Stay close, and watch for glowing berries.\"", 4000);
      } else if (index === 3) {
        showMessage("Blackberry: \"We've reached the Oak Grove. The treasure must be here.\"", 4000);
        showTreasureScene();
      }
    }

    // --- Search button logic ---
    function showSearchButton(obj, tapsRequired = 1) {
      currentSearchTarget = obj;
      currentSearchTapsRequired = tapsRequired;
      currentSearchTaps = 0;
      searchButton.style.display = "block";

      searchButton.onclick = () => {
        if (!currentSearchTarget) return;
        const objX = parseInt(currentSearchTarget.style.left);
        const objY = parseInt(currentSearchTarget.style.top);

        currentSearchTaps++;
        rustlingSound.currentTime = 0;
        rustlingSound.play();
        createParticles(objX + 40, objY + 40, "#ffaa00");

        if (currentSearchTaps >= currentSearchTapsRequired) {
          searchButton.style.display = "none";
          currentSearchTarget.remove();
          spawnBerryAt(objX + 20, objY + 20);
          currentSearchTarget = null;
        } else {
          showMessage("Blackberry: \"Hmm, something's hidden here... keep searching!\"", 1500);
        }
      };
    }

    function hideSearchButton() {
      searchButton.style.display = "none";
      currentSearchTarget = null;
    }

    // --- Berry handling ---
    function spawnBerryAt(x, y) {
      const berry = document.createElement('img');
      berry.src = berryImage;
      berry.className = 'berry';
      berry.style.left = x + "px";
      berry.style.top = y + "px";

      berry.addEventListener('click', () => {
        collectBerry(berry);
      });

      gameArea.appendChild(berry);
    }

    function collectBerry(berry) {
      berry.remove();
      berriesLeft--;
      collectedTotal++;
      berryCountEl.textContent = berriesLeft;
      popSound.currentTime = 0;
      popSound.play();
      createParticles(parseInt(berry.style.left) + 20, parseInt(berry.style.top) + 20, "#ffcc00");

      if (berriesLeft <= 0 && currentLevelIndex < levelData.length - 1) {
        showMessage("Blackberry: \"We found all the berries here! Let's see where they lead...\"", 4000);
        showMap();
      }
    }

    // --- Map & level progression ---
    function showMap() {
      mapOverlay.style.display = "block";
    }

    goToOakButton.addEventListener('click', () => {
      mapOverlay.style.display = "none";
      if (currentLevelIndex < levelData.length - 1) {
        startLevel(currentLevelIndex + 1);
      }
    });

    function showTreasureScene() {
      showMessage("Blackberry: \"The clue said: 'Where the blackberry vines meet the old oak.' Tap the oak!\"", 6000);

      objects.forEach(obj => {
        obj.addEventListener('click', () => {
          const objX = parseInt(obj.style.left);
          const objY = parseInt(obj.style.top);
          movePlayerTo(objX, objY);
          waitForArrival(objX, objY, () => {
            treasureSound.currentTime = 0;
            treasureSound.play();
            createParticles(objX + 40, objY + 40, "#ffd700");
            showMessage("Blackberry: \"You found the treasure! The path of the unknown awaits...\"", 8000);
          });
        }, { once: true });
      });
    }

    // --- Creatures ---
    function spawnCreatures(level) {
      const count = 3;
      for (let i = 0; i < count; i++) {
        const c = document.createElement('img');
        c.src = level.creatures[Math.floor(Math.random() * level.creatures.length)];
        c.className = 'creature';
        const x = Math.random() * (window.innerWidth - 80);
        const y = Math.random() * (window.innerHeight - 160) + 80;
        c.style.left = x + "px";
        c.style.top = y + "px";

        c.addEventListener('click', () => {
          creatureSound.currentTime = 0;
          creatureSound.play();
          createParticles(x + 30, y + 30, "#ffffff");
          showMessage("Blackberry: \"Did you see that? The forest creatures know where the berries hide.\"", 3000);
          c.style.transition = "transform 0.8s ease, opacity 0.8s ease";
          c.style.transform = "translateY(-100px)";
          c.style.opacity = "0";
          setTimeout(() => c.remove(), 800);
        });

        gameArea.appendChild(c);
        creatures.push(c);
      }
    }

    // --- Random events ---
    function triggerRandomEvent() {
      const eventType = Math.random();
      if (eventType < 0.5) {
        const x = Math.random() * window.innerWidth;
        createFallingLeaf(x);
      } else {
        rustlingSound.currentTime = 0;
        rustlingSound.play();
        showMessage("Blackberry: \"Did you hear that? Something moved in the bushes...\"", 2500);
      }
    }

    function createFallingLeaf(x) {
      const leaf = document.createElement('div');
      leaf.className = 'particle';
      leaf.style.background = "#a0522d";
      leaf.style.left = x + "px";
      leaf.style.top = "-10px";
      gameArea.appendChild(leaf);

      const duration = 4000;
      const start = performance.now();

      function animateLeaf(time) {
        const t = (time - start) / duration;
        if (t >= 1) {
          leaf.remove();
          return;
        }
        const y = t * window.innerHeight;
        const sway = Math.sin(t * 6) * 30;
        leaf.style.top = y + "px";
        leaf.style.left = (x + sway) + "px";
        requestAnimationFrame(animateLeaf);
      }
      requestAnimationFrame(animateLeaf);
    }

    // --- Particle effects ---
    function createParticles(x, y, color) {
      for (let i = 0; i < 8; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.background = color;
        p.style.left = x + "px";
        p.style.top = y + "px";
        gameArea.appendChild(p);

        const angle = Math.random() * Math.PI * 2;
        const speed = 40 + Math.random() * 40;
        const dx = Math.cos(angle) * speed;
        const dy = Math.sin(angle) * speed;
        const duration = 500;
        const start = performance.now();

        function animate(time) {
          const t = (time - start) / duration;
          if (t >= 1) {
            p.remove();
            return;
          }
          p.style.left = (x + dx * t) + "px";
          p.style.top = (y + dy * t) + "px";
          p.style.opacity = (1 - t).toString();
          requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);
      }
    }

    // --- Init ---
    window.addEventListener('load', () => {
      createPlayer();
      startLevel(0);
    });
  </script>
</body>
</html>
